version: "3.8"

services:
  # ─── Base de datos PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: inventario_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - inventario_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── n8n (Motor de automatización) ─────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: inventario_n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_CORS_ALLOW_ORIGIN: "http://192.168.10.133:3000,http://172.29.144.1:3000,http://localhost:3000,*"
      N8N_CORS_ALLOW_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
      N8N_CORS_ALLOW_HEADERS: "Content-Type,Authorization"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      GENERIC_TIMEZONE: America/Guatemala
      TZ: America/Guatemala
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/files
      - ./workflows:/workflows
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inventario_net

  # ─── Adminer (Gestor visual de BD) ─────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: inventario_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - inventario_net

# ─── Volúmenes y red ──────────────────────────────────────────────────────────
volumes:
  postgres_data:
  n8n_data:

networks:
  inventario_net:
    driver: bridge